name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub release with an archive for each platform and their checksums,
# then a container image on GitHub's registry and the signed OpenWrt feed on GitHub Pages.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          flags="-s -w -X main.version=${GITHUB_REF_NAME#v}"
          build() {
            mkdir -p "pkg/$1"
            go build -trimpath -tags "$4" -ldflags="$flags $3" -o "pkg/$1/$2" ./cmd/btproxy
            cp LICENSE README.md "pkg/$1/"
          }
          GOOS=linux GOARCH=amd64 build linux-amd64 btproxy
          GOOS=linux GOARCH=arm64 build linux-arm64 btproxy
          GOOS=linux GOARCH=arm GOARM=7 build linux-armv7 btproxy
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat build linux-mipsle btproxy
          GOOS=linux GOARCH=amd64 build linux-amd64-nobluez btproxy "" nobluez
          GOOS=linux GOARCH=arm64 build linux-arm64-nobluez btproxy "" nobluez
          GOOS=linux GOARCH=arm GOARM=7 build linux-armv7-nobluez btproxy "" nobluez
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat build linux-mipsle-nobluez btproxy "" nobluez
          GOOS=windows GOARCH=amd64 build windows-amd64 btproxy.exe "-H windowsgui"
          mkdir -p dist
          for d in pkg/linux-*; do
            tar -C "$d" --owner=0 --group=0 -cf - btproxy LICENSE README.md | gzip -9 > "dist/btproxy-${d#pkg/}.tar.gz"
          done
          (cd pkg/windows-amd64 && zip -9q ../../dist/btproxy-windows-amd64.zip btproxy.exe LICENSE README.md)
          docker run --rm -v "$PWD:/src" -w /src -e "VERSION=${GITHUB_REF_NAME#v}" alpine:3.23 sh -c '
            apk add -q tar
            for a in amd64 arm64 armv7 mipsle; do
              contrib/openwrt/package.sh "$VERSION" "$a" "pkg/linux-$a/btproxy" dist
              contrib/openwrt/package.sh "$VERSION" "$a" "pkg/linux-$a-nobluez/btproxy" dist nobluez
            done
            contrib/openwrt/package-luci.sh "$VERSION" dist'
          sudo chown -R "$(id -u):$(id -g)" dist
          (cd dist && sha256sum btproxy* luci-app-btproxy* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  feed:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }} # not for pre-releases such as v1.0.0-rc1
    runs-on: ubuntu-latest
    environment: openwrt-feed
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
          APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p packages site/keys
          gh release download "$GITHUB_REF_NAME" --dir packages --pattern '*.ipk' --pattern '*.apk'
          key=$(mktemp -d)
          (umask 077; printf '%s\n' "$USIGN_KEY" > "$key/usign"; printf '%s\n' "$APK_KEY" > "$key/apk")
          docker run --rm --entrypoint /bin/sh -v "$PWD:/src" -v "$key:/key:ro" -w /src openwrt/rootfs:x86_64-24.10.8 \
            contrib/openwrt/feed.sh opkg "$version" packages site /key/usign
          docker run --rm -v "$PWD:/src" -v "$key:/key:ro" -w /src alpine:3.23 \
            sh contrib/openwrt/feed.sh apk "$version" packages site /key/apk
          sudo chown -R "$(id -u):$(id -g)" site
          cp contrib/openwrt/keys/usign.pub contrib/openwrt/keys/btproxy.pem site/keys/
          rm -rf "$key"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    needs: feed
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
