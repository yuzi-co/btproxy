name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub release with an archive for each platform and their checksums,
# then a container image on GitHub's registry.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          flags="-s -w -X main.version=${GITHUB_REF_NAME#v}"
          build() {
            mkdir -p "pkg/$1"
            go build -trimpath -ldflags="$flags $3" -o "pkg/$1/$2" ./cmd/btproxy
            cp LICENSE README.md "pkg/$1/"
          }
          GOOS=linux GOARCH=amd64 build linux-amd64 btproxy
          GOOS=linux GOARCH=arm64 build linux-arm64 btproxy
          GOOS=linux GOARCH=arm GOARM=7 build linux-armv7 btproxy
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat build linux-mipsle btproxy
          GOOS=windows GOARCH=amd64 build windows-amd64 btproxy.exe "-H windowsgui"
          mkdir -p dist
          for d in pkg/linux-*; do
            tar -C "$d" --owner=0 --group=0 -cf - btproxy LICENSE README.md | gzip -9 > "dist/btproxy-${d#pkg/}.tar.gz"
          done
          (cd pkg/windows-amd64 && zip -9q ../../dist/btproxy-windows-amd64.zip btproxy.exe LICENSE README.md)
          (cd dist && sha256sum btproxy* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
