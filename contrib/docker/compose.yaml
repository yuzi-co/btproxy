# Uses the kernel backend, or BlueZ on the host while bluetoothd runs there. See "Docker" in the README for what this
# setup cannot do.
services:
  btproxy:
    image: ghcr.io/yuzi-co/btproxy:latest
    container_name: btproxy
    restart: unless-stopped
    # Bluetooth sockets only work in the initial network namespace, and mDNS needs the LAN.
    network_mode: host
    volumes:
      # The keys of bonded devices, on the kernel backend.
      - btproxy-bonds:/etc/btproxy
      # BlueZ on the host. The directory rather than the socket, so the mount survives a restart of the host's D-Bus.
      - /run/dbus:/run/dbus:ro
      # API encryption: put the key in ./btproxy.key, then uncomment this line and the argument below.
      # - ./btproxy.key:/btproxy.key:ro
    read_only: true
    cap_drop: [ALL]
    # NET_RAW: the HCI monitor and connection parameters; on BlueZ, the proxy rebuilds advertisements without it.
    # NET_ADMIN: the management socket, on the kernel backend.
    cap_add: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    command:
      - -name=btproxy-docker
      # - -encryption-key-file=/btproxy.key

volumes:
  btproxy-bonds:
